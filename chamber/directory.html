<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="David Adepegba">
    <meta name="description"
        content="Browse the Lagos Chamber of Commerce business directory — find contact details, addresses, and websites for member companies across Lagos, Nigeria.">

    <!-- favicon -->
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">

    <!-- Facebook meta -->
    <meta property="og:title" content="Lagos Chamber of Commerce — Business Directory">
    <meta property="og:description"
        content="Explore member businesses of the Lagos Chamber of Commerce. Search by grid or list view to find company contact info, addresses, and websites.">
    <meta property="og:image"
        content="https://www.lagoschamber.com/wp-content/uploads/2024/04/cropped-logo-599x599-1-1.png">
    <meta property="og:url" content="https://adepegba1.github.io/wdd231/chamber/directory.html">
    <title>Directory of Lagos Chamber of Commerce</title>

    <!-- font style -->

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles/directory.css">
    <link rel="stylesheet" href="styles/directory-large.css">


    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- JavaScript -->
    <script src="scripts/directory.js" defer></script>
</head>

<body>
    <header>
        <!-- Logo and Company Name -->
        <div class="logo">
            <img src="images/chamber.jpg" alt="Company Logo">
            <span>Lagos Chamber of Commerce</span>
            <button id="ham-btn" class="hamburger"></button>
        </div>

        <!-- Navigation -->
        <div class="nav">
            <nav id="nav-bar" class="navigation">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li class="current"><a href="directory.html">Directory</a></li>
                    <li><a href="#">Join</a></li>
                    <li><a href="#">Discover</a></li>
                    <button class="theme-toggle" aria-label="Toggle dark mode"></button>
                </ul>
            </nav>

        </div>
    </header>
    <main>
        <h1>Directory</h1>
        <div class="display-toggle">
            <button id="gridBtn" class="active">Grid</button>
            <button id="listBtn">List</button>
        </div>
        <div id="directory" class="grid"></div>
    </main>
    <footer>
        <div class="company">
            <p><strong>Lagos Chamber of Commerce</strong></p>
            <p>13/15 Segun Irefin Street</p>
            <p>Lagos, Nigeria</p>
            <p>info@lagoscc.org</p>
            <p>(234) 813 792 4205</p>
        </div>
        <div class="social-media">
            <a href="https://youtube.com"><img src="images/youtube.svg" alt="Youtube Logo"></a>
            <a href="https://www.linkedin.com/in/adepegbadavid1/"><img src="images/linkedin.svg"
                    alt="LinkedIn Logo"></a>
            <a href="https://x.com/adepegbadavid1"><img src="images/twitter.svg" alt="Twitter Logo"></a>
        </div>
        <div class="student">
            <p><strong>WDD231 Project</strong></p>
            <p>David Adepegba</p>
            <p>&copy; <span id="currentyear"></span> Lagos Chamber of Commerce</p>
            <p>Last Modification: <span id="lastModified"></span></p>
        </div>
    </footer>

</body>

</html>
